# Single source of truth for the base compose file (.vibecode/standards/docker.md
# points here). Published ports bind to 127.0.0.1 only (.claude/rules/docker.md).
# Healthchecks use tools that exist in the base images: python (python:3.12-slim
# has no curl) and busybox wget (node:20-alpine has no curl).
services:
  backend:
    build: ./backend
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"    # MANDATORY on all services
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app              # Live reload in dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"    # MANDATORY on all services
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"   # Vite dev server runs with --port 3000
    volumes:
      - ./frontend:/app             # Live reload in dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"    # MANDATORY on all services
    # No published port in the base file — expose to the host (GUI tools) only via
    # the gitignored docker-compose.override.yml.
    volumes:
      - ./data/postgres:/var/lib/postgresql/data   # Persisted on host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"    # MANDATORY on all services
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    tmpfs:
      - /var/lib/postgresql/data    # RAM-backed — no persistence, maximum speed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Internal network only — not exposed to host

  tome:
    image: ghcr.io/vxcozy/tome:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"    # MANDATORY on all services
    volumes:
      - ./docs:/docs:ro             # Read-only live mount
    ports:
      - "127.0.0.1:${TOME_PORT}:4000"   # Port assigned from ports file
    healthcheck:
      # Image contents are upstream-controlled: try busybox wget, fall back to curl.
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000 >/dev/null 2>&1 || curl -fsS http://localhost:4000 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3

  # redis / elasticsearch / mongodb — add only after architecture plan approval
